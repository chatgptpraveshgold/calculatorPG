<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pravesh Gold | Calculator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        maroon: '#4d1616',
                        cream: '#fdf8f0',
                        'result-gold': '#f5e2a1',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        [x-cloak] { display: none !important; }
        
        html, body {
            height: 100%;
            overflow: hidden;
            background-color: #fdf8f0;
            background-image: 
                radial-gradient(circle at 100% 0%, rgba(77, 22, 22, 0.02), transparent 40%),
                radial-gradient(circle at 0% 100%, rgba(212, 175, 55, 0.03), transparent 40%);
            background-attachment: fixed;
        }

        .rectangular-tab {
            background: white;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .maroon-header {
            background: #4d1616;
            margin: 1rem 1.5rem 0.5rem;
            border-radius: 0.75rem;
            padding: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .premium-input {
            width: 100%;
            background: #fdfdfd;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            font-size: 0.9375rem; /* 15px */
            transition: all 0.2s;
            appearance: none;
            color: #000;
        }

        .premium-input:focus {
            outline: none;
            border-color: #4d1616;
            box-shadow: 0 0 0 3px rgba(77, 22, 22, 0.05);
        }

        .result-container {
            background: #f5e2a1;
            border-radius: 1rem;
            padding: 1.25rem;
            text-align: center;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="font-sans text-stone-900 flex items-center justify-center p-4" 
      x-data="calculatorApp()" 
      x-init="init()">

    <div class="rectangular-tab">
        <!-- Header -->
        <div class="maroon-header">
            <img src="Logo.png" alt="Pravesh Gold Logo" class="w-40 h-auto object-contain">
        </div>
        <p class="text-stone-400 text-[10px] font-bold text-center uppercase tracking-tighter mb-2">Auto Calculator</p>

        <!-- Dynamic Content -->
        <div class="px-6 pb-6 space-y-4 flex-grow flex flex-col justify-center">
            
            <template x-if="status === 'SUCCESS' && data">
                <div x-cloak class="space-y-4">
                    <!-- Date Pill -->
                    <div class="flex flex-col items-center space-y-1">
                        <div class="bg-stone-50 border border-stone-100 rounded-full py-2 px-6 shadow-sm flex flex-col items-center">
                            <p class="text-stone-600 text-[10px] font-semibold leading-tight">
                                <span x-text="data.date"></span>
                            </p>
                            <p class="text-[10px] font-bold text-maroon/60 leading-tight">
                                Last Updated: <span x-text="data.time || new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true })"></span>
                            </p>
                        </div>
                    </div>

                    <!-- Inputs Section -->
                    <div class="space-y-4">
                        <!-- Karat -->
                        <div class="space-y-1">
                            <label class="block text-xs font-bold text-stone-700 ml-1">Karat</label>
                            <div class="relative">
                                <select x-model="selectedKarat" class="premium-input font-bold">
                                    <option value="22KT">22KT</option>
                                    <option value="18KT">18KT</option>
                                    <option value="24KT">24KT (Gold Coins)</option>
                                </select>
                                <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none opacity-40">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                                </div>
                            </div>
                        </div>

                        <!-- Weight (Conditional) -->
                        <div x-show="selectedKarat !== '24KT'" class="space-y-1">
                            <label class="block text-xs font-bold text-stone-700 ml-1">Weight (grams)</label>
                            <input type="number" placeholder="e.g. 10.250" x-model="weight" class="premium-input" step="0.001">
                        </div>

                        <!-- Making (Conditional) -->
                        <div x-show="selectedKarat !== '24KT'" class="space-y-1">
                            <label class="block text-xs font-bold text-stone-700 ml-1">Making Type</label>
                            <div class="relative">
                                <select x-model="makingType" class="premium-input">
                                    <template x-for="type in Object.keys(MAKING_RANGES)">
                                        <option :value="type" x-text="type"></option>
                                    </template>
                                </select>
                                <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none opacity-40">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                                </div>
                            </div>
                        </div>

                        <!-- Coins (Conditional) -->
                        <div x-show="selectedKarat === '24KT'" class="space-y-2">
                            <label class="block text-xs font-bold text-stone-700 ml-1">Coin Weight</label>
                            <div class="grid grid-cols-4 gap-2">
                                <template x-for="w in COIN_WEIGHTS">
                                    <button @click="coinWeight = w" 
                                            :class="coinWeight === w ? 'bg-maroon border-maroon text-white scale-105' : 'bg-white border-stone-200 text-stone-500'"
                                            class="py-2 rounded-lg border font-bold text-[10px] transition-all"
                                            x-text="w + 'g'"></button>
                                </template>
                            </div>
                        </div>

                        <!-- Result Area -->
                        <div class="pt-2">
                            <div class="result-container space-y-0.5 shadow-sm">
                                <p class="text-stone-500 text-[10px] font-bold uppercase tracking-wider">Estimated Price</p>
                                <template x-if="selectedKarat !== '24KT'">
                                    <h2 class="text-xl font-black text-stone-900 tracking-tight" x-text="jewelleryPriceString() || '...'"></h2>
                                </template>
                                <template x-if="selectedKarat === '24KT'">
                                    <h2 class="text-xl font-black text-stone-900 tracking-tight" x-text="coinPriceString()"></h2>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Loading State -->
            <template x-if="status === 'INITIALIZING'">
                <div class="py-12 flex flex-col items-center justify-center space-y-4">
                    <svg class="animate-spin h-8 w-8 text-maroon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle class="opacity-10" cx="12" cy="12" r="10" stroke-width="4"></circle><path fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <p class="text-stone-400 text-xs font-bold animate-pulse">Syncing Gold Rates...</p>
                </div>
            </template>
        </div>

        <!-- Footer (Inside the Rectangular Tab) -->
        <footer class="bg-stone-50 border-t border-stone-100 p-4 text-center">
            <div class="text-[8.5px] font-medium text-stone-400 leading-tight space-y-0.5">
                <p>Prices include 3% GST. Final billing at showroom.</p>
                <p class="font-bold text-stone-600 uppercase tracking-tighter">Pravesh Gold, Kalyan West.</p>
            </div>
        </footer>
    </div>

    <script>
        const MAKING_RANGES = {
            Classic: { min: 0.09, max: 0.11 },
            Antique: { min: 0.10, max: 0.13 },
            Premium: { min: 0.13, max: 0.15 },
            Italian: { min: 0.17, max: 0.19 },
        };
        const COIN_WEIGHTS = [0.5, 1, 2, 5, 10, 20, 50];
        const GST_RATE = 0.03;
        const COIN_MAKING_RATE = 0.03;

        function calculatorApp() {
            return {
                status: 'INITIALIZING',
                data: null,
                selectedKarat: '22KT',
                weight: '',
                makingType: 'Classic',
                coinWeight: 1,
                timer: null,

                init() {
                    this.fetchRates();
                },

                fetchRates() {
                    this.status = 'INITIALIZING';
                    
                    // SAFETY TIMER: Force loading after 5 seconds if connection hangs
                    const forceTimer = setTimeout(() => {
                        if (this.status === 'INITIALIZING') {
                            console.log("Forcing fallback due to timeout");
                            this.useFallback();
                        }
                    }, 5000);

                    fetch('/api/rates')
                        .then(res => res.ok ? res.json() : Promise.reject())
                        .then(data => {
                            clearTimeout(forceTimer);
                            this.data = data;
                            this.status = 'SUCCESS';
                        })
                        .catch(() => {
                            clearTimeout(forceTimer);
                            this.useFallback();
                        });
                },

                useFallback() {
                    this.data = {
                        date: new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'long', year: 'numeric' }),
                        time: new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true }),
                        rates: { rate_22k: 6500, rate_24k: 7100, rate_18k: 5300 }
                    };
                    this.status = 'SUCCESS';
                },

                formatCurrency(val) {
                    return new Intl.NumberFormat('en-IN', {
                        style: 'currency', currency: 'INR', maximumFractionDigits: 0,
                    }).format(Math.round(val));
                },

                jewelleryPriceString() {
                    const w = parseFloat(this.weight);
                    if (isNaN(w) || w <= 0) return null;
                    const r = this.selectedKarat === '22KT' ? this.data.rates.rate_22k : this.data.rates.rate_18k;
                    const b = w * r;
                    const low = (b + (b * MAKING_RANGES[this.makingType].min)) * (1 + GST_RATE);
                    const high = (b + (b * MAKING_RANGES[this.makingType].max)) * (1 + GST_RATE);
                    return this.formatCurrency(low) + ' – ' + this.formatCurrency(high);
                },

                coinPriceString() {
                    const b = this.coinWeight * this.data.rates.rate_24k;
                    const f = (b + (b * COIN_MAKING_RATE)) * (1 + GST_RATE);
                    return this.formatCurrency(f);
                }
            }
        }
    </script>
</body>
</html>
